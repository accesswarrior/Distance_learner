<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f1a">
  <title>Werewolf - Classroom Game</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app">
    <!-- Loading -->
    <div class="screen active" id="loading-screen">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>

    <!-- Auth -->
    <div class="screen" id="auth-screen">
      <div class="auth-card">
        <h1 class="game-title">🐺 Werewolf</h1>
        <p class="tagline">The classic social deduction game</p>

        <div class="auth-form">
          <input type="text" id="username" placeholder="Username" autocomplete="off" autocapitalize="none">
          <input type="text" id="display-name" placeholder="Display name (shown to other players)" autocomplete="off" maxlength="24" style="display:none;">
          <input type="password" id="pin" placeholder="6-digit PIN" maxlength="6" inputmode="numeric" pattern="[0-9]*">

          <button id="login-btn" class="primary-btn">Login</button>
          <button id="signup-btn" class="secondary-btn" style="display:none;">Sign Up</button>
          <p class="hint-text" id="signup-hint" style="display:none;">Display name is what everyone else sees in the game instead of your username.</p>

          <p id="auth-error" class="error-message"></p>

          <p class="toggle-auth-mode"><a href="#" id="toggle-auth-mode-link">New here? Create an account</a></p>
        </div>
      </div>
    </div>

    <!-- Room choice -->
    <div class="screen" id="lobby-choice-screen">
      <div class="auth-card">
        <h2>Welcome, <span id="welcome-username"></span></h2>

        <label for="timer-select" class="hint-text">Discussion timer for day rounds (optional):</label>
        <select id="timer-select">
          <option value="">No timer</option>
          <option value="3">3 minutes</option>
          <option value="4">4 minutes</option>
          <option value="5">5 minutes</option>
        </select>
        <button id="create-room-btn" class="primary-btn">Create Room</button>

        <div class="join-room-form">
          <input type="text" id="join-code-input" placeholder="Room Code" maxlength="6" autocomplete="off" autocapitalize="characters">
          <button id="join-room-btn" class="secondary-btn">Join Room</button>
        </div>

        <p id="lobby-choice-error" class="error-message"></p>

        <button class="logout-btn secondary-btn">Logout</button>
      </div>
    </div>

    <!-- Waiting room -->
    <div class="screen" id="lobby-screen">
      <div class="lobby-container" id="lobby-content"></div>
    </div>

    <!-- Live game screen (role reveal + everything after) -->
    <div class="screen" id="role-screen">
      <div class="role-container" id="role-content"></div>
    </div>

    <!-- Purely decorative night/day transition flash. Lives outside every
         .screen so it survives their innerHTML rewrites; toggled by ui.js. -->
    <div class="phase-overlay" id="phase-overlay" aria-hidden="true"></div>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

  <!-- Core -->
  <script src="js/core/firebaseConfig.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/engine.js"></script>
  <script src="js/core/lobby.js"></script>

  <!-- Werewolf -->
  <script src="js/games/werewolf/rules.js"></script>
  <script src="js/games/werewolf/voting.js"></script>
  <script src="js/games/werewolf/night.js"></script>
  <script src="js/games/werewolf/narrator.js"></script>
  <script src="js/games/werewolf/ui.js"></script>

  <!-- Boot -->
  <script src="js/main.js"></script>
</body>
</html>
