<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f1a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🎭%3C/text%3E%3C/svg%3E">
  <meta name="description" content="Hijinks — group games for hanging out with friends. Everyone plays on their own phone.">
  <title>Hijinks — Log in</title>
  <link rel="stylesheet" href="css/main.css">

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
</head>
<body data-root="" data-page="index.html">
  <div id="app">
    <!-- Loading (shown until Firebase reports whether someone is already signed in) -->
    <div class="screen active" id="loading-screen">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>

    <!-- Log in -->
    <div class="screen" id="auth-screen">
      <div class="auth-card">
        <h1 class="game-title">🎭 Hijinks</h1>
        <p class="tagline">Group games for hanging out with friends</p>

        <button type="button" id="google-btn" class="google-btn">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          <span>Continue with Google</span>
        </button>

        <div class="auth-divider"><span>or use your email</span></div>

        <form id="login-form" class="auth-form" novalidate>
          <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" autocapitalize="none" inputmode="email">
          <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password">
          <label class="show-password"><input type="checkbox" id="show-password"> Show password</label>
          <button type="submit" id="login-btn" class="primary-btn">Log in</button>
        </form>

        <p id="auth-error" class="error-message" role="alert"></p>
        <p id="auth-info" class="info-message" role="status"></p>

        <p class="toggle-auth-mode"><a href="#" id="forgot-link">Forgot password?</a></p>
        <p class="toggle-auth-mode">New here? <a href="signup.html" id="other-page-link">Create an account</a></p>
      </div>
    </div>
  </div>

  <!-- Core -->
  <script src="js/core/firebaseConfig.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/ui-helpers.js"></script>
  <script src="js/core/auth-page-common.js"></script>
  <script src="js/core/password-ui.js"></script>
  <script src="js/core/login-page.js"></script>
</body>
</html>
