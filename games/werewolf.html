<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f1a">
  <title>Werewolf - Classroom Game</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/werewolf.css">
</head>
<body data-root="../" data-page="games/werewolf.html">
  <div id="app">
    <!-- Loading -->
    <div class="screen active" id="loading-screen">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>

    <!-- Room choice -->
    <div class="screen" id="lobby-choice-screen">
      <div class="auth-card">
        <h2>Welcome, <span id="welcome-username"></span></h2>

        <label for="timer-select" class="hint-text">Discussion timer for day rounds (optional):</label>
        <select id="timer-select">
          <option value="">No timer</option>
          <option value="3">3 minutes</option>
          <option value="4">4 minutes</option>
          <option value="5">5 minutes</option>
        </select>
        <button id="create-room-btn" class="primary-btn">Create Room</button>

        <div class="join-room-form">
          <input type="text" id="join-code-input" placeholder="Room Code" maxlength="6" autocomplete="off" autocapitalize="characters">
          <button id="join-room-btn" class="secondary-btn">Join Room</button>
        </div>

        <p id="lobby-choice-error" class="error-message"></p>

        <a class="link-btn secondary-btn" href="../hub.html">← All games</a>
        <button class="logout-btn secondary-btn">Log out</button>
      </div>
    </div>

    <!-- Waiting room -->
    <div class="screen" id="lobby-screen">
      <div class="lobby-container" id="lobby-content"></div>
    </div>

    <!-- Live game screen (role reveal + everything after) -->
    <div class="screen" id="role-screen">
      <div class="role-container" id="role-content"></div>
    </div>

    <!-- Purely decorative night/day transition flash. Lives outside every
         .screen so it survives their innerHTML rewrites; toggled by werewolf/ui.js. -->
    <div class="phase-overlay" id="phase-overlay" aria-hidden="true"></div>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

  <!-- Core (shared by every game) -->
  <script src="../js/core/firebaseConfig.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/ui-helpers.js"></script>

  <!-- Werewolf -->
  <script src="../js/werewolf/engine.js"></script>
  <script src="../js/werewolf/lobby.js"></script>
  <script src="../js/werewolf/rules.js"></script>
  <script src="../js/werewolf/voting.js"></script>
  <script src="../js/werewolf/night.js"></script>
  <script src="../js/werewolf/narrator.js"></script>
  <script src="../js/werewolf/ui.js"></script>

  <!-- Boot -->
  <script src="../js/werewolf/main.js"></script>
</body>
</html>
